<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weather-wear 画面プロトタイプ</title>
<!--
  チェックポイント③のイメージ用のプロトタイプ（AI が作成）。実装には使わない。
  「正常」の状態だけを置いている。読み込み中・0件・エラーは 03_画面.md で決めてから足す。
  数字は 02_仕様.md の例（朝17℃・昼20℃・夜15℃、降水確率17時に60%）に合わせている。
-->
<style>
  :root {
    --bg: #eef1f5;
    --phone: #ffffff;
    --text: #1d2430;
    --muted: #677285;
    --line: #dde2ea;
    --accent: #2f6fde;
    --accent-weak: #e6eefc;
    --warm: #c2571a;
    --warm-weak: #fdeee4;
    --cool: #2a7f9e;
    --cool-weak: #e3f3f8;
    --disabled: #b8c0cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --phone: #1c2029;
      --text: #e7eaf0;
      --muted: #9aa3b3;
      --line: #2f3542;
      --accent: #6b9cf2;
      --accent-weak: #24324d;
      --warm: #f0955f;
      --warm-weak: #3b2a20;
      --cool: #6cc3e0;
      --cool-weak: #1d343d;
      --disabled: #4a5261;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    line-height: 1.6;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lead { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .screens {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: center;
  }
  figure { margin: 0; }
  figcaption { text-align: center; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .phone {
    position: relative;
    width: 320px;
    max-width: calc(100vw - 32px);
    height: 640px;
    background: var(--phone);
    border: 1px solid var(--line);
    border-radius: 28px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 18px 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 16px; }
  .logout { font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .body { flex: 1; overflow: hidden; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
  .date { font-size: 13px; color: var(--muted); margin: 0; }
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .label { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .main-wear { font-size: 22px; font-weight: 700; margin: 0; }
  .temps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
  .temps b { display: block; font-size: 16px; color: var(--text); }
  .note { border-radius: 10px; padding: 8px 10px; font-size: 13px; margin: 8px 0 0; }
  .note.warm { background: var(--warm-weak); color: var(--warm); }
  .note.cool { background: var(--cool-weak); color: var(--cool); }
    .umbrella { display: flex; justify-content: space-between; align-items: baseline; }
  .umbrella .main-wear { font-size: 18px; }
  .rain { font-size: 13px; color: var(--muted); }
  .btn {
    display: block; width: 100%; border: none; border-radius: 12px; padding: 12px;
    font-size: 15px; font-weight: 600; background: var(--accent); color: #fff;
  }
  .btn[disabled] { background: var(--disabled); color: #fff; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin: 6px 0 0; }
  .tabbar { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
  .tab { padding: 12px 0 18px; text-align: center; font-size: 13px; color: var(--muted); }
  .tab.active { color: var(--accent); font-weight: 700; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .list .day { color: var(--muted); font-size: 13px; width: 72px; }
  .list .val { flex: 1; }
  .list .none { color: var(--muted); }
  .edit { font-size: 12px; border: 1px solid var(--line); background: none; color: var(--accent); border-radius: 999px; padding: 2px 10px; }
  .form { padding: 36px 22px; display: flex; flex-direction: column; gap: 14px; }
  .form h2 { font-size: 20px; margin: 20px 0 8px; text-align: center; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
  .link { text-align: center; font-size: 13px; color: var(--accent); }
  .overlay { position: absolute; inset: 0; background: rgba(10, 14, 20, 0.45); display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: var(--phone); border-radius: 20px 20px 0 0; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 10px; }
  .sheet h3 { margin: 0; font-size: 16px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice { border: 1px solid var(--line); border-radius: 12px; padding: 12px 0; text-align: center; font-size: 14px; }
  .choice.selected { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); font-weight: 700; }
  .cancel { text-align: center; font-size: 13px; color: var(--muted); }
  .dim { opacity: 0.35; }
  /* index.html#home のように開くと、その画面だけを表示する（スクショ用） */
  body:has(figure:target) { padding: 0; background: var(--phone); }
  body:has(figure:target) h1, body:has(figure:target) .lead, body:has(figure:target) figcaption, body:has(figure:target) figure:not(:target) { display: none; }
  body:has(figure:target) .screens { display: block; }
  body:has(figure:target) .phone { width: 360px; max-width: none; height: 720px; border: none; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<h1>weather-wear 画面プロトタイプ</h1>
<p class="lead">チェックポイント③のイメージ（正常の状態）。読み込み中・0件・エラーは、03_画面.md で決めてから足す。</p>

<div class="screens">

  <!-- ログイン -->
  <figure id="login">
    <div class="phone">
      <div class="form">
        <h2>weather-wear</h2>
        <div class="field"><label>メールアドレス</label><div>taro@example.com</div></div>
        <div class="field"><label>パスワード</label><div>••••••••</div></div>
        <button class="btn">ログイン</button>
        <p class="link">新規登録はこちら</p>
      </div>
    </div>
    <figcaption>ログイン</figcaption>
  </figure>

  <!-- 新規登録 -->
  <figure id="register">
    <div class="phone">
      <div class="form">
        <h2>新規登録</h2>
        <div class="field"><label>ユーザー名</label><div>taro</div></div>
        <div class="field"><label>メールアドレス</label><div>taro@example.com</div></div>
        <div class="field"><label>パスワード</label><div>••••••••</div></div>
        <button class="btn">登録する</button>
        <p class="link">登録済みの方はログイン</p>
      </div>
    </div>
    <figcaption>新規登録</figcaption>
  </figure>

  <!-- ホーム（感想は未登録） -->
  <figure id="home">
    <div class="phone">
      <div class="top"><span class="brand">weather-wear</span><button class="logout">ログアウト</button></div>
      <div class="body">
        <p class="date">11月8日（土）・現在地</p>
        <div class="card">
          <p class="label">今日の服装（朝7時の体感温度で判定）</p>
          <p class="main-wear">薄手ジャケット</p>
          <div class="temps">
            <div>朝 7時<b>17℃</b></div>
            <div>昼 11〜13時<b>20℃</b></div>
            <div>夜 17〜19時<b>15℃</b></div>
          </div>
          <p class="note warm">昼は暖かいので、脱ぎやすい服を着てください</p>
          <p class="note cool">夜は冷えるので、もう1枚厚い上着を</p>
        </div>
        <div class="card">
          <div class="umbrella">
            <p class="main-wear">折り畳み傘</p>
            <span class="rain">最大降水確率60%（17時）</span>
          </div>
        </div>
        <div>
          <button class="btn">今日の感想を登録する</button>
        </div>
      </div>
      <div class="tabbar"><span class="tab active">ホーム</span><span class="tab">感想一覧</span></div>
    </div>
    <figcaption>ホーム（今日の感想は未登録）</figcaption>
  </figure>

  <!-- ホーム（感想は登録済み） -->
  <figure id="home-done">
    <div class="phone">
      <div class="top"><span class="brand">weather-wear</span><button class="logout">ログアウト</button></div>
      <div class="body">
        <p class="date">11月8日（土）・現在地</p>
        <div class="card">
          <p class="label">今日の服装（朝7時の体感温度で判定）</p>
          <p class="main-wear">薄手ジャケット</p>
          <div class="temps">
            <div>朝 7時<b>17℃</b></div>
            <div>昼 11〜13時<b>20℃</b></div>
            <div>夜 17〜19時<b>15℃</b></div>
          </div>
          <p class="note warm">昼は暖かいので、脱ぎやすい服を着てください</p>
          <p class="note cool">夜は冷えるので、もう1枚厚い上着を</p>
        </div>
        <div class="card">
          <div class="umbrella">
            <p class="main-wear">折り畳み傘</p>
            <span class="rain">最大降水確率60%（17時）</span>
          </div>
        </div>
        <div>
          <button class="btn" disabled>今日の感想を登録する</button>
          <p class="hint">今日の感想は登録済みです（編集は感想一覧から）</p>
        </div>
      </div>
      <div class="tabbar"><span class="tab active">ホーム</span><span class="tab">感想一覧</span></div>
    </div>
    <figcaption>ホーム（今日の感想は登録済み）</figcaption>
  </figure>

  <!-- 感想の登録モーダル -->
  <figure id="modal">
    <div class="phone">
      <div class="top dim"><span class="brand">weather-wear</span><button class="logout">ログアウト</button></div>
      <div class="body dim">
        <p class="date">11月8日（土）・現在地</p>
        <div class="card"><p class="label">今日の服装</p><p class="main-wear">薄手ジャケット</p></div>
      </div>
      <div class="overlay">
        <div class="sheet">
          <h3>今日の服装はどうでしたか？</h3>
          <p class="label">11月8日（土）・おすすめ: 薄手ジャケット</p>
          <div class="choices">
            <span class="choice">暑かった</span>
            <span class="choice selected">ちょうどよい</span>
            <span class="choice">寒かった</span>
            <span class="choice">家を出ていない</span>
          </div>
          <button class="btn">登録する</button>
          <p class="cancel">キャンセル</p>
        </div>
      </div>
    </div>
    <figcaption>感想の登録モーダル（編集も同じ形）</figcaption>
  </figure>

  <!-- 感想一覧 -->
  <figure id="list">
    <div class="phone">
      <div class="top"><span class="brand">weather-wear</span><button class="logout">ログアウト</button></div>
      <div class="body">
        <p class="date">今日と、昨日までの7日間の感想</p>
        <ul class="list">
          <li><span class="day">11/8（土）</span><span class="val none">まだ今日の感想はありません</span></li>
          <li><span class="day">11/7（金）</span><span class="val">寒かった</span><button class="edit">編集</button></li>
          <li><span class="day">11/6（木）</span><span class="val none">感想なし</span></li>
          <li><span class="day">11/5（水）</span><span class="val">暑かった</span><button class="edit">編集</button></li>
          <li><span class="day">11/4（火）</span><span class="val">寒かった</span><button class="edit">編集</button></li>
          <li><span class="day">11/3（月）</span><span class="val">家を出ていない</span><button class="edit">編集</button></li>
          <li><span class="day">11/2（日）</span><span class="val none">感想なし</span></li>
          <li><span class="day">11/1（土）</span><span class="val">ちょうどよい</span><button class="edit">編集</button></li>
        </ul>
      </div>
      <div class="tabbar"><span class="tab">ホーム</span><span class="tab active">感想一覧</span></div>
    </div>
    <figcaption>感想一覧（直近1週間）</figcaption>
  </figure>

</div>
</body>
</html>
